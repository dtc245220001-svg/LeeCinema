log_format safe_json escape=json '{"time":"$time_iso8601","service":"nginx","method":"$request_method","path":"$uri","status":$status,"duration":$request_time}';
access_log /var/log/cinema/access.log safe_json;
error_log /var/log/cinema/error.log warn;
server {
 listen 80;
 server_tokens off;
 client_max_body_size 16k;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location / { proxy_pass http://app:3001; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_connect_timeout 5s; proxy_read_timeout 30s; }
 location = /nginx_status { stub_status; access_log off; allow 172.16.0.0/12; allow 127.0.0.1; deny all; }
}
