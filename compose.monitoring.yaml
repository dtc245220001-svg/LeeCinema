services:
  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [frontend, monitoring]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    ports: ["127.0.0.1:${GRAFANA_PORT:-3002}:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitoring]
    depends_on: [prometheus]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    command: ["--nginx.scrape-uri=http://nginx/nginx_status"]
    networks: [frontend]
    depends_on:
      nginx: {condition: service_healthy}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  mysql-exporter:
    image: prom/mysqld-exporter:v0.17.2
    command: ["--config.my-cnf=/cfg/exporter.cnf"]
    volumes: ["./monitoring/mysql/exporter.cnf:/cfg/exporter.cnf:ro"]
    networks: [database, frontend]
    depends_on:
      db: {condition: service_healthy}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    command: ["--docker_only=true", "--store_container_labels=true", "--housekeeping_interval=15s", "--enable_metrics=cpu,memory,network,diskIO"]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [frontend]
    restart: unless-stopped
networks:
  monitoring:
volumes:
  prometheus_data:
  grafana_data:
