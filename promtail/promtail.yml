server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /positions/positions.yml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: cinema-app
    static_configs:
      - targets: [localhost]
        labels:
          project: leecinema
          service: app
          __path__: /logs/app/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            time: time
      - labels:
          level:
      - timestamp:
          source: time
          format: RFC3339Nano
  - job_name: cinema-nginx
    static_configs:
      - targets: [localhost]
        labels:
          project: leecinema
          service: nginx
          stream: access
          __path__: /logs/nginx/access.log
    pipeline_stages:
      - json:
          expressions:
            time: time
      - timestamp:
          source: time
          format: RFC3339
  - job_name: cinema-nginx-errors
    static_configs:
      - targets: [localhost]
        labels:
          project: leecinema
          service: nginx
          stream: error
          __path__: /logs/nginx/error.log
